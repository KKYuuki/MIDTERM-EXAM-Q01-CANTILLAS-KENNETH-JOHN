<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Event Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #222;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #222;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .panel {
      background: white;
      padding: 25px;
      border: 1px solid #ddd;
      margin-bottom: 24px;
    }
    .panel h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      font: inherit;
    }
    input:focus {
      outline: 2px solid #555;
      outline-offset: 1px;
    }
    button {
      background: #444;
      color: white;
      padding: 12px 20px;
      border: 1px solid #444;
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #222;
      outline-offset: 2px;
    }
    .search-form {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      margin-bottom: 15px;
    }
    .search-form label {
      flex: 1 1 180px;
      margin: 0;
    }
    .search-form input {
      display: block;
      margin-top: 5px;
    }
    .number-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .status-message {
      min-height: 20px;
      margin: 14px 0;
      color: #666;
      font-size: 0.92rem;
    }
    .status-message.error {
      color: #b42318;
    }
    .events-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .event-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fafafa;
      padding: 18px;
      border: 1px solid #ddd;
    }
    .event-details {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .event-card h3 {
      color: #333;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    .event-meta,
    .event-capacity {
      color: #555;
      margin: 5px 0;
      font-size: 0.9rem;
    }
    .event-capacity {
      font-weight: 600;
    }
    .button-delete {
      flex: 0 0 auto;
      padding: 9px 12px;
      background: white;
      color: #444;
      border: 1px solid #aaa;
    }
    .empty-state,
    .loading {
      color: #666;
      padding: 12px 0;
    }
    @media (max-width: 520px) {
      body {
        padding: 14px;
      }
      h1 {
        font-size: 2rem;
      }
      .panel {
        padding: 18px;
      }
      .number-fields {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .section-heading {
        align-items: flex-start;
      }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Campus Event Management</h1>

    <section class="panel" aria-labelledby="events-heading">
      <div class="section-heading">
        <h2 id="events-heading">Events</h2>
        <button id="refresh-button" type="button">Refresh</button>
      </div>

      <form id="search-form" class="search-form">
        <label for="search-name">
          Find an event by name
          <input id="search-name" name="name" type="search" required>
        </label>
        <button type="submit">Search</button>
        <button id="show-all-button" type="button">Show all</button>
      </form>

      <p id="status-message" class="status-message" role="status" aria-live="polite">Loading events...</p>
      <div id="events-list" class="events-list" aria-live="polite">
        <p class="loading">Loading events...</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="add-event-heading">
      <h2 id="add-event-heading">Add New Event</h2>
      <form id="add-event-form">
        <div class="form-group">
          <label for="event-name">Event name</label>
          <input id="event-name" name="event_name" type="text" required maxlength="200">
        </div>
        <div class="form-group">
          <label for="event-date">Date</label>
          <input id="event-date" name="date" type="date" required>
        </div>
        <div class="form-group">
          <label for="event-venue">Venue</label>
          <input id="event-venue" name="venue" type="text" required maxlength="200">
        </div>
        <div class="number-fields">
          <div class="form-group">
            <label for="event-capacity">Capacity</label>
            <input id="event-capacity" name="capacity" type="number" min="0" step="1" required>
          </div>
          <div class="form-group">
            <label for="event-registered">Registered</label>
            <input id="event-registered" name="registered" type="number" min="0" step="1" value="0" required>
          </div>
        </div>
        <button type="submit">Add Event</button>
      </form>
    </section>
  </main>
</body>
</html>
